<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 972 518" width="972" height="518" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="title">The Gemini API, three providers: the routes match the model in the path, and the AI Protocol Manager's AI filters transcode the requests other providers serve</title>
  <desc id="desc">A Gemini API client sends POST /v1beta/models/{model}:generateContent to Envoy. The routes match the model in the path: gpt-* models go to OpenAI, claude-* models to Anthropic, gemini-* models to Vertex AI, and any other model gets a local 404. The AI Protocol Manager runs two transcoder AI filters, from the client's API, Gemini GenerateContent, into the canonical form, OpenAI Chat Completions, and from it into the route's provider API, and converts the response back; requests for Gemini models are not transcoded. One dynamic forward proxy cluster connects to api.openai.com, api.anthropic.com or aiplatform.googleapis.com over TLS.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
    <marker id="arrow-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4f46e5"/></marker>
  </defs>

  <rect x="0.5" y="0.5" width="971" height="517" rx="18" fill="#ffffff" stroke="#e2e8f0"/>

  <!-- Client -->
  <rect x="276" y="20" width="420" height="72" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="292" y="44"><tspan font-size="14" font-weight="700" fill="#0f172a">Client</tspan><tspan dx="8" font-size="12" fill="#64748b">Google Gen AI SDK or curl</tspan></text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#334155">
    <text x="292" y="64">POST /v1beta/models/claude-haiku-4-5:generateContent</text>
    <text x="292" y="81">{"contents": [...]}</text>
  </g>
  <line x1="486" y1="94" x2="486" y2="166" stroke="#64748b" stroke-width="1.6" marker-start="url(#arrow)"/>
  <text x="496" y="112" font-size="12" fill="#64748b">Gemini API</text>

  <!-- Envoy -->
  <rect x="20" y="120" width="932" height="264" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="36" y="146" font-size="16" font-weight="700" fill="#0f172a">Envoy</text>
  <text x="936" y="146" font-size="12" text-anchor="end" fill="#64748b">listener :10000</text>

  <!-- Routes -->
  <path d="M310 166H872" fill="none" stroke="#64748b" stroke-width="1.6"/>
  <g stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)">
    <line x1="310" y1="166" x2="310" y2="180"/>
    <line x1="518" y1="166" x2="518" y2="180"/>
    <line x1="726" y1="166" x2="726" y2="180"/>
    <line x1="872" y1="166" x2="872" y2="180"/>
  </g>
  <text x="52" y="195" font-size="13" font-weight="700" fill="#334155">routes</text>
  <text x="52" y="209" font-size="11.5" fill="#64748b">match the model in the path</text>
  <g fill="#ffffff" stroke="#94a3b8" stroke-width="1.5">
    <rect x="250" y="182" width="120" height="30" rx="15"/>
    <rect x="458" y="182" width="120" height="30" rx="15"/>
    <rect x="666" y="182" width="120" height="30" rx="15"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="700" text-anchor="middle" fill="#334155">
    <text x="310" y="201.5">gpt-*</text>
    <text x="518" y="201.5">claude-*</text>
    <text x="726" y="201.5">gemini-*</text>
  </g>
  <rect x="810" y="182" width="124" height="30" rx="15" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="872" y="201.5" font-size="11.5" text-anchor="middle" fill="#475569">anything else → 404</text>

  <g stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)">
    <line x1="310" y1="212" x2="310" y2="222"/>
    <line x1="518" y1="212" x2="518" y2="222"/>
    <line x1="726" y1="212" x2="726" y2="222"/>
  </g>

  <!-- AI Protocol Manager: transcode -->
  <rect x="36" y="224" width="900" height="94" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.8"/>
  <text x="52" y="248" font-size="13" font-weight="700" fill="#3730a3">AI Protocol Manager</text>
  <text x="52" y="264" font-size="11.5" fill="#4f46e5">AI filters</text>
  <rect x="228" y="236" width="220" height="30" rx="15" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="338" y="255.5" text-anchor="middle" fill="#312e81"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="700">transcoder</tspan><tspan font-size="12"> client API → IR</tspan></text>
  <line x1="450" y1="251" x2="474" y2="251" stroke="#4f46e5" stroke-width="1.6" marker-end="url(#arrow-indigo)"/>
  <rect x="476" y="236" width="232" height="30" rx="15" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="592" y="255.5" text-anchor="middle" fill="#312e81"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="700">transcoder</tspan><tspan font-size="12"> IR → provider API</tspan></text>
  <text x="724" y="255" font-size="11.5" fill="#4f46e5">IR: OpenAI Chat Completions</text>
  <g fill="#ffffff" stroke="#a5b4fc" stroke-width="1.5">
    <rect x="220" y="276" width="180" height="30" rx="8"/>
    <rect x="428" y="276" width="180" height="30" rx="8"/>
  </g>
  <rect x="636" y="276" width="180" height="30" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <g font-size="12.5" text-anchor="middle" fill="#1e1b4b">
    <text x="310" y="295.5">OpenAI Chat Completions</text>
    <text x="518" y="295.5">Anthropic Messages</text>
  </g>
  <text x="726" y="295" font-size="11.5" text-anchor="middle" fill="#475569">not transcoded</text>

  <g stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)">
    <line x1="310" y1="306" x2="310" y2="334"/>
    <line x1="518" y1="306" x2="518" y2="334"/>
    <line x1="726" y1="306" x2="726" y2="334"/>
  </g>

  <!-- One dynamic forward proxy cluster -->
  <rect x="36" y="336" width="900" height="34" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="52" y="358" font-size="13" font-weight="700" fill="#334155">dynamic forward proxy</text>
  <text x="228" y="358" font-size="12.5" fill="#334155">one cluster for every provider, over TLS with the route's host as SNI</text>

  <!-- Providers -->
  <g stroke="#64748b" stroke-width="1.6" marker-start="url(#arrow)" marker-end="url(#arrow)">
    <line x1="310" y1="372" x2="310" y2="408"/>
    <line x1="518" y1="372" x2="518" y2="408"/>
    <line x1="726" y1="372" x2="726" y2="408"/>
  </g>
  <text x="736" y="400" font-size="12" fill="#64748b">provider API</text>
  <g fill="#ffffff" stroke="#94a3b8" stroke-width="1.5">
    <rect x="212" y="410" width="196" height="86" rx="10"/>
    <rect x="420" y="410" width="196" height="86" rx="10"/>
    <rect x="628" y="410" width="196" height="86" rx="10"/>
  </g>
  <g font-size="13.5" font-weight="700" fill="#0f172a">
    <text x="226" y="432">OpenAI</text>
    <text x="434" y="432">Anthropic</text>
    <text x="642" y="432">Vertex AI (Gemini)</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#334155">
    <text x="226" y="452">api.openai.com</text>
    <text x="226" y="469">/v1/chat/completions</text>
    <text x="434" y="452">api.anthropic.com</text>
    <text x="434" y="469">/v1/messages</text>
    <text x="642" y="452">aiplatform.googleapis.com</text>
    <text x="642" y="469">...:generateContent</text>
    <text x="642" y="486">...:streamGenerateContent</text>
  </g>
</svg>
